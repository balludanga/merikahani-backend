databases:
  - name: lekhanii-db
    databaseName: lekhani
    user: lekhani
    plan: free

services:
  # Lekhani API — हिंदी लेखकों का अपना मंच
  - type: web
    name: lekhanii-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: lekhanii-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_URL
        value: https://lekhanii.vercel.app
    autoDeploy: true
