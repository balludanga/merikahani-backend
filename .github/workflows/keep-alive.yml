name: Keep-alive ping

# Render's free tier puts the API to sleep after 15 minutes without traffic, and the
# first request after that takes about a minute. Supabase free-tier projects also pause
# after 7 days without requests. One DB-backed request every 10 minutes keeps both awake.
# One instance running all month is ~744 hours, inside Render's 750 free hours.
# GitHub may delay a scheduled run by several minutes under load; that is fine.
# Runs on the default branch only, and GitHub turns off schedules after 60 days without
# a push to the repo.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping API
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
              "https://lekhanii-backend.onrender.com/api/posts?limit=1" || true)
            echo "attempt $i -> HTTP ${code:-none}"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "API did not return 200 after 3 attempts" >&2
          exit 1
