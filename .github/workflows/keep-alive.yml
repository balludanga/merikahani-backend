name: Keep-alive ping

# Supabase free-tier projects pause after 7 days without incoming requests.
# This job hits a DB-backed endpoint every 2 days so the production database
# never goes idle. Runs on the default branch only.

on:
  schedule:
    - cron: "30 4 */2 * *" # every 2 days at 04:30 UTC
  workflow_dispatch: {} # manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 240 \
              https://lekhanii-backend.onrender.com/api/posts || true)
            echo "attempt $i -> HTTP ${code:-none}"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "API did not return 200 after 3 attempts" >&2
          exit 1
